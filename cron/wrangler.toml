# Worker de tareas programadas (Pages no tiene cron). Comparte la base D1 con el sitio.
name = "dental-gert-cron"
main = "index.js"
compatibility_date = "2026-01-15"
workers_dev = false

[triggers]
crons = ["*/15 * * * *", "5 6 1 * *", "0 9 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dental-gert"
database_id = "29bc98a5-335d-45bd-8eb4-d1d9fbc99720"
migrations_dir = "../migrations"

